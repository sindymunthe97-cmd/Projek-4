<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .tanya { 
      color: bisque; 
    }

    .jawab { 
      color: blue; 
    }

    /* class tambahan */
    .tanyajawab {
      color: greenyellow;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Belajar CSS</h1>
  <p class="tanya">Menggunakan class tanya</p>
  <!-- tambahkan class tanyajawab di sini -->
  <p class="jawab tanyajawab">Menggunakan class jawab</p>
</body>
</html>
